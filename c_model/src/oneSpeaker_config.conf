[audio]
rate = 48000
period_size = 256
periods = 4 #4 periods in a buffer, so buffer size is 1024 samples
format = S16_LE

[speakers]
0 = hw:CARD=1,DEV=0 #key = value, can nest them
1 = hw:CARD=1,DEV=0 #key = value, can nest them

[reference_mics] #section
2 = hw:CARD=1,DEV=0 #key = value, can nest them

[error_mics]
3 = hw:CARD=1,DEV=0 #key = value, can nest them